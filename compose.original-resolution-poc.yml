name: zeeland-original-resolution-poc

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    logging: *bounded-logs
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:18013:80"
    depends_on:
      - qgis-server
  qgis-server:
    logging: *bounded-logs
    image: qgis/qgis-server:stable
    restart: unless-stopped
    platform: linux/amd64
    environment:
      SKIP_NGINX: "true"
      QT_QPA_PLATFORM: offscreen
      DISPLAY: ":99"
      QGIS_SERVER_PARALLEL_RENDERING: "false"
      QGIS_SERVER_MAX_THREADS: "1"
      QGIS_SERVER_WMS_MAX_HEIGHT: "5000"
      QGIS_SERVER_WMS_MAX_WIDTH: "5000"
    command:
      - /bin/sh
      - -lc
      - |
        /usr/bin/Xvfb :99 -ac -screen 0 1280x1024x16 +extension GLX +render -noreset >/dev/null 2>&1 &
        exec spawn-fcgi -n -a 0.0.0.0 -p 9993 -u www-data -g www-data -d /var/lib/qgis -- /usr/lib/cgi-bin/qgis_mapserv.fcgi
    volumes:
      - ${ZEELAND_1M_DATA_PATH:?Set ZEELAND_1M_DATA_PATH in the worktree .env}:/io/data:ro
      - ${ZEELAND_NATIVE_SOURCE_PATH:?Set ZEELAND_NATIVE_SOURCE_PATH in the worktree .env}/elevation-dsm:/data/zeeland/acquisition-20261005/elevation-dsm:ro
      - ${ZEELAND_NATIVE_SOURCE_PATH:?Set ZEELAND_NATIVE_SOURCE_PATH in the worktree .env}/ahn3-dsm:/data/zeeland/acquisition-20261005/ahn3-dsm:ro
      - ${ZEELAND_NATIVE_SOURCE_PATH:?Set ZEELAND_NATIVE_SOURCE_PATH in the worktree .env}/bulk-dsm:/data/zeeland/acquisition-20261005/bulk-dsm:ro
  qgis:
    logging: *bounded-logs
    image: heatstress-digital-shadow-qgis
    platform: linux/amd64
    ports:
      - "127.0.0.1:19003:8000"
    volumes:
      - ./qgis:/app:ro
      - ${ZEELAND_1M_DATA_PATH:?Set ZEELAND_1M_DATA_PATH in the worktree .env}:/data
      - ${ZEELAND_NATIVE_SOURCE_PATH:?Set ZEELAND_NATIVE_SOURCE_PATH in the worktree .env}/elevation-dsm:/data/zeeland/acquisition-20261005/elevation-dsm:ro
      - ${ZEELAND_NATIVE_SOURCE_PATH:?Set ZEELAND_NATIVE_SOURCE_PATH in the worktree .env}/ahn3-dsm:/data/zeeland/acquisition-20261005/ahn3-dsm:ro
      - ${ZEELAND_NATIVE_SOURCE_PATH:?Set ZEELAND_NATIVE_SOURCE_PATH in the worktree .env}/bulk-dsm:/data/zeeland/acquisition-20261005/bulk-dsm:ro
    environment:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
      QGIS_DEBUG: "0"
      PYTHONPATH: /usr/share/qgis/python
      DATA_PATH: /data
      GDAL_CACHEMAX: "256"
      CPL_TMPDIR: /tmp
  backend:
    logging: *bounded-logs
    image: heatstress-digital-shadow-backend
    environment:
      QGIS_URL: http://qgis:8000
      QGIS_SERVER_URL: http://nginx/nginx
    ports:
      - "127.0.0.1:18003:8000"
    volumes:
      - ./backend:/app
      - ${ZEELAND_1M_DATA_PATH:?Set ZEELAND_1M_DATA_PATH in the worktree .env}:/data
  frontend:
    logging: *bounded-logs
    image: heatstress-digital-shadow-frontend
    ports:
      - "127.0.0.1:15176:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_REGION_NAME: Zeeland
      VITE_PET_RESOLUTION: "1"
      VITE_REGION_VIEW: '[3.2,51.19,4.35,51.79,115000]'
    command: sh -c "npm ci --include=dev && exec npm run dev -- --host"
